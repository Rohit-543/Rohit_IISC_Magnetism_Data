<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Susceptibility vs T and 1/T</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1d2330;--mut:#667085;--card:#f4f5f8;--bd:#d3d8e0;--ac:#2f6fed}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161c;--fg:#e6e9ef;--mut:#98a2b3;--card:#1c212a;--bd:#343b48;--ac:#6c9bff}}
:root[data-theme="dark"]{--bg:#13161c;--fg:#e6e9ef;--mut:#98a2b3;--card:#1c212a;--bd:#343b48;--ac:#6c9bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:14px 0 6px}
main{display:grid;grid-template-columns:310px 1fr;gap:12px;padding:12px;max-width:1500px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
aside,.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}input[type=number]{width:80px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0}
#chips{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}#chips label{justify-content:flex-start;margin:1px 0;font-size:13px;cursor:pointer}
i.sw{width:11px;height:11px;border-radius:2px;display:inline-block;flex:none}
canvas{width:100%;height:560px;display:block;touch-action:none}@media(max-width:700px){canvas{height:420px}}
#tip{position:fixed;pointer-events:none;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:3px 7px;font:12px ui-monospace,monospace;display:none;z-index:5;white-space:pre}
dialog{max-width:780px;width:92vw;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:10px}
pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;max-height:70vh;overflow:auto}small{color:var(--mut)}
</style></head><body>
<header><h1>📈 Susceptibility vs T and 1/T</h1><button id="th">Physics &amp; theory</button></header>
<main>
<aside>
<h3>Axes</h3>
<label>x axis <select id="xm"><option value="T">T (K)</option><option value="inv">1/T (K⁻¹)</option></select></label>
<label>y quantity <select id="yq"><option value="chi">χ</option><option value="inv">1/χ (Curie–Weiss plot)</option></select></label>
<label>y scale <select id="ys"><option value="log">log |value|</option><option value="lin">linear</option></select></label>
<label>T range (K) <span><input id="t0" type="number" value="2" min="1" step="1"> – <input id="t1" type="number" value="1500" min="2" step="10"></span></label>
<label>Units <select id="un"><option value="SI">SI (dimensionless)</option><option value="CGS">CGS (emu cm⁻³ Oe⁻¹)</option></select></label>
<label><span><input type="checkbox" id="pa"> Pt, Pd, Al as Pauli (T-independent)</span></label>
<h3>Materials</h3>
<div class="r" id="cls"></div>
<div class="r" style="margin-top:6px"><button id="all">All</button><button id="none">None</button></div>
<div id="chips" style="margin-top:8px"></div>
<p><small>Hover the plot to read χ(T). Vertical dotted lines mark T<sub>C</sub> (FM/FiM), T<sub>N</sub> (AFM) and T<sub>B</sub> (SPM). Negative χ (diamagnets) are drawn dotted on log axes.</small></p>
</aside>
<section class="box"><canvas id="cv"></canvas></section>
</main>
<div id="tip"></div>
<dialog id="dg"><pre id="tx"></pre><button onclick="this.parentNode.close()">Close</button></dialog>
<script>
"use strict";
const MU0=4e-7*Math.PI,KB=1.380649e-23,MUB=9.274010e-24,$=q=>document.querySelector(q);
const KN={dia:'Diamagnetic',para:'Paramagnetic',fm:'Ferromagnetic',afm:'Antiferromagnetic',fim:'Ferrimagnetic',spm:'Superparamagnetic'};
const HUE={dia:212,para:172,fm:2,afm:32,fim:285,spm:120};
// Same materials as the B-H simulator. chi = room-temperature SI volume susceptibility; Ms in A/m; mu in muB; d in nm; K in J/m3
const MAT=[
{n:'Bi',k:'dia',chi:-1.66e-4},{n:'Cu',k:'dia',chi:-1e-5},{n:'Au',k:'dia',chi:-3.4e-5},{n:'Ag',k:'dia',chi:-2.4e-5},{n:'Si',k:'dia',chi:-3.9e-6},
{n:'Pt',k:'para',chi:2.6e-4},{n:'Pd',k:'para',chi:7.9e-4},{n:'Al',k:'para',chi:2.2e-5},
{n:'Fe',k:'fm',Ms:1.71e6,Tc:1043,mu:2.2},{n:'Co',k:'fm',Ms:1.42e6,Tc:1388,mu:1.7},{n:'Ni',k:'fm',Ms:4.85e5,Tc:627,mu:.6},
{n:'Permalloy',k:'fm',Ms:8e5,Tc:850,mu:1},{n:'CoFeB',k:'fm',Ms:1.1e6,Tc:1000,mu:1.8},
{n:'NiO',k:'afm',chi:3e-4,TN:523,th:2000},{n:'IrMn',k:'afm',chi:2e-4,TN:690,th:1000},
{n:'Fe3O4',k:'fim',Ms:4.8e5,Tc:858,mu:4},{n:'YIG',k:'fim',Ms:1.4e5,Tc:560,mu:5},
{n:'Fe3O4 NPs',k:'spm',Ms:4.8e5,d:10,phi:.3,K:1.1e4},{n:'Co NPs',k:'spm',Ms:1.42e6,d:5,phi:.2,K:4.5e5},{n:'Ni NPs',k:'spm',Ms:4.85e5,d:6,phi:.25,K:4.5e3}];
// ---------- physics ----------
const L=x=>Math.abs(x)<1e-4?x/3:1/Math.tanh(x)-1/x;                         // Langevin
const Lp=x=>Math.abs(x)<1e-2?1/3-x*x/15:1/(x*x)-1/Math.pow(Math.sinh(x),2);  // L'(x)
function sigma(T,Tc){if(T>=Tc)return 0;let a=1e-12,b=1;for(let i=0;i<70;i++){const m=(a+b)/2;(L(3*m*Tc/T)-m>0?a=m:b=m)}return(a+b)/2} // sigma = L(3 sigma Tc/T)
const fA=(T,m)=>T>m.TN?(m.TN+m.th)/(T+m.th):(3-Math.pow(sigma(T,m.TN),2))/3; // AFM shape (unit chi_N)
function build(pauli){
 const S=[];
 MAT.forEach((m,i)=>{
  const j=MAT.filter(x=>x.k==m.k).indexOf(m),cnt=MAT.filter(x=>x.k==m.k).length;
  const col=`hsl(${HUE[m.k]+(j%2?10:-8)},72%,${cnt>1?36+24*j/(cnt-1):48}%)`,b={m,col,vis:true};
  if(m.k=='dia')S.push({...b,id:m.n,f:T=>m.chi,mk:[]});
  else if(m.k=='para')S.push({...b,id:m.n,f:T=>pauli?m.chi:m.chi*300/T,mk:[]});
  else if(m.k=='fm'||m.k=='fim'){const C=MU0*m.Ms*m.mu*MUB/(3*KB);
   S.push({...b,id:m.n,mk:[['T_C',m.Tc]],f:T=>{if(T>=m.Tc)return C/(T-m.Tc);const x=3*sigma(T,m.Tc)*m.Tc/T,l=Lp(x);return 3*C/T*l/(1-3*m.Tc/T*l)}})}
  else if(m.k=='afm'){const cN=m.chi/fA(300,m);S.push({...b,id:m.n,mk:[['T_N',m.TN]],f:T=>cN*fA(T,m)})}
  else{const V=Math.PI/6*Math.pow(m.d*1e-9,3),C=m.phi*MU0*m.Ms*m.Ms*V/(3*KB),TB=m.K*V/(25*KB);
   S.push({...b,id:m.n+' FC',mk:[['T_B',TB]],f:T=>C/T},{...b,id:m.n+' ZFC',zfc:1,mk:[],f:T=>T>=TB?C/T:C/TB*T/TB,pair:m.n})}
 });return S}
// ---------- UI ----------
let S=build(false);const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=v=>!isFinite(v)?'—':(Math.abs(v)>=1e4||(v!=0&&Math.abs(v)<1e-2))?v.toExponential(2):String(+v.toPrecision(3));
const U=()=>$('#un').value=='CGS'?1/(4*Math.PI):1;
let lay=null;
function tk(a,b){const s=(b-a)/6,m=Math.pow(10,Math.floor(Math.log10(s))),f=s/m,st=(f<1.5?1:f<3.5?2:f<7.5?5:10)*m,o=[];for(let v=Math.ceil(a/st)*st;v<=b+1e-9*st;v+=st)o.push(Math.abs(v)<1e-9*st?0:v);return o}
function draw(){
 const c=$('#cv'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);
 const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.font='11px system-ui,sans-serif';
 const W=r.width,H=r.height,Lm=66,R=12,Tp=12,Bm=42,fg=css('--fg'),gr=css('--bd');
 const inv=$('#xm').value=='inv',yinv=$('#yq').value=='inv',lg=$('#ys').value=='log',uf=U();
 let t0=Math.max(.5,+$('#t0').value||2),t1=Math.max(t0*1.1,+$('#t1').value||1500);
 const tY=ch=>{let v=ch*uf;if(yinv)v=1/v;return lg?Math.log10(Math.abs(v)):v};
 const x0=inv?1/t1:t0,x1=inv?1/t0:t1,N=500,Ts=[];
 for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;Ts.push(inv?1/x:x)}
 const vis=S.filter(s=>s.vis);
 for(const s of vis)for(const[,Tm]of s.mk)for(const e of[1e-3,3e-3,1e-2,3e-2])for(const q of[1-e,1+e])if(Tm*q>t0&&Tm*q<t1)Ts.push(Tm*q);
 Ts.sort((a,b)=>a-b);
 const ys=vis.map(s=>Ts.map(T=>{const v=tY(s.f(T));return isFinite(v)?v:NaN}));
 let all=[];ys.forEach(a=>a.forEach(v=>{if(isFinite(v))all.push(v)}));
 let y0=0,y1=1;
 if(all.length){all.sort((a,b)=>a-b);
  if(lg){y0=Math.floor(all[0]-.1);y1=Math.ceil(all[all.length-1]+.1)}
  else{const q0=all[Math.floor(.01*(all.length-1))],q1=all[Math.floor(.99*(all.length-1))],p=.06*((q1-q0)||1);y0=Math.min(q0,0)-p;y1=Math.max(q1,0)+p}}
 if(y1<=y0)y1=y0+1;
 const X=x=>Lm+(x-x0)/(x1-x0)*(W-Lm-R),Y=y=>H-Bm-(y-y0)/(y1-y0)*(H-Bm-Tp);
 lay={Lm,R,W,H,Tp,Bm,x0,x1,y0,y1,inv,yinv,lg,uf,vis,tY,X,Y};
 g.clearRect(0,0,W,H);g.lineWidth=1;g.fillStyle=fg;g.strokeStyle=gr;
 g.textAlign='center';for(const v of tk(x0,x1)){g.beginPath();g.moveTo(X(v),Tp);g.lineTo(X(v),H-Bm);g.stroke();g.fillText(inv?fmt(v):String(v),X(v),H-Bm+14)}
 g.textAlign='right';
 if(lg)for(let e=y0;e<=y1;e++){g.beginPath();g.moveTo(Lm,Y(e));g.lineTo(W-R,Y(e));g.stroke();g.fillText('10'+String(e).replace(/-/g,'−').replace(/\d/g,m=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[m]),Lm-5,Y(e)+4)}
 else for(const v of tk(y0,y1)){g.beginPath();g.moveTo(Lm,Y(v));g.lineTo(W-R,Y(v));g.stroke();g.fillText(fmt(v),Lm-5,Y(v)+4)}
 g.strokeStyle=fg;g.strokeRect(Lm,Tp,W-Lm-R,H-Bm-Tp);
 g.textAlign='center';g.fillText(inv?'1/T (K⁻¹)':'T (K)',(Lm+W-R)/2,H-6);
 const unit=$('#un').value=='CGS'?'emu cm⁻³ Oe⁻¹':'SI';
 g.save();g.translate(13,(Tp+H-Bm)/2);g.rotate(-Math.PI/2);g.fillText((lg?'log ':'')+(yinv?'|1/χ|':'|χ|').replace(/\|/g,lg?'|':'')+' ('+unit+')',0,0);g.restore();
 g.save();g.beginPath();g.rect(Lm,Tp,W-Lm-R,H-Bm-Tp);g.clip();
 vis.forEach((s,i)=>{ // transition markers
  s.mk.forEach(([lb,Tm],q)=>{if(Tm<=t0||Tm>=t1)return;const x=X(inv?1/Tm:Tm);g.strokeStyle=s.col;g.globalAlpha=.45;g.setLineDash([2,4]);g.beginPath();g.moveTo(x,Tp);g.lineTo(x,H-Bm);g.stroke();g.setLineDash([]);g.globalAlpha=1;g.fillStyle=s.col;g.textAlign='left';g.fillText(lb,x+3,Tp+11+(i%5)*11)})});
 vis.forEach((s,i)=>{
  const neg=s.m.k=='dia';g.strokeStyle=s.col;g.lineWidth=1.7;g.setLineDash(s.zfc?[6,3]:(neg&&lg)?[1.5,3]:[]);
  let pen=false;g.beginPath();
  Ts.forEach((T,j)=>{const v=ys[i][j];if(!isFinite(v)){pen=false;return}const x=X(inv?1/T:T),y=Y(v);pen?g.lineTo(x,y):g.moveTo(x,y);pen=true});
  g.stroke()});
 g.restore();g.setLineDash([]);
 if(!vis.length){g.fillStyle=fg;g.textAlign='center';g.fillText('Select at least one material',W/2,H/2)}}
// hover readout
$('#cv').addEventListener('pointermove',e=>{
 const tip=$('#tip');if(!lay){return}const r=e.target.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,l=lay;
 if(mx<l.Lm||mx>l.W-l.R||my<l.Tp||my>l.H-l.Bm||!l.vis.length){tip.style.display='none';return}
 const xv=l.x0+(mx-l.Lm)/(l.W-l.Lm-l.R)*(l.x1-l.x0),T=l.inv?1/xv:xv;let best=null,bd=18;
 for(const s of l.vis){const c=s.f(T),y=l.tY(c);if(!isFinite(y))continue;const dd=Math.abs(l.Y(y)-my);if(dd<bd){bd=dd;best=[s,c]}}
 if(!best){tip.style.display='none';return}
 const[s,c]=best,v=c*l.uf;
 tip.textContent=`${s.id}  (${KN[s.m.k]})\nT = ${fmt(T)} K   1/T = ${fmt(1/T)} K⁻¹\nχ = ${fmt(v)}   1/χ = ${fmt(1/v)}`;
 tip.style.display='block';tip.style.left=Math.min(e.clientX+12,innerWidth-250)+'px';tip.style.top=(e.clientY+12)+'px'});
$('#cv').addEventListener('pointerleave',()=>$('#tip').style.display='none');
// controls
function chips(){
 $('#chips').innerHTML=MAT.map(m=>{const s=S.filter(x=>x.m==m);return`<label title="${KN[m.k]}"><input type="checkbox" data-n="${m.n}" ${s[0].vis?'checked':''}><i class="sw" style="background:${s[0].col}"></i>${m.n}</label>`}).join('')}
const setVis=(f)=>{S.forEach(s=>s.vis=f(s.m));chips();draw()};
$('#chips').addEventListener('change',e=>{const n=e.target.dataset.n;S.forEach(s=>{if(s.m.n==n)s.vis=e.target.checked});draw()});
$('#cls').innerHTML=Object.keys(KN).map(k=>`<button data-k="${k}"><i class="sw" style="background:hsl(${HUE[k]},72%,48%)"></i> ${KN[k].slice(0,5)}.</button>`).join('');
$('#cls').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,on=S.some(s=>s.m.k==k&&!s.vis);S.forEach(s=>{if(s.m.k==k)s.vis=on});chips();draw()});
$('#all').onclick=()=>setVis(()=>true);$('#none').onclick=()=>setVis(()=>false);
$('#pa').onchange=()=>{const v=new Map(S.map(s=>[s.id,s.vis]));S=build($('#pa').checked);S.forEach(s=>s.vis=v.get(s.id));draw()};
['#xm','#yq','#ys','#un','#t0','#t1'].forEach(i=>$(i).addEventListener('input',draw));
$('#tx').textContent=`PHYSICS & THEORY — susceptibility χ(T)
χ = M/H (SI, volume, dimensionless). CGS: χ[emu cm⁻³ Oe⁻¹] = χ_SI / 4π.
Same materials as the B–H simulator; room-temperature χ values and Ms are unchanged.
Temperature scales (T_C, T_N, atomic moments, anisotropy K, θ) are literature-level
approximate values added for this page; they are illustrative, not fitted.

Diamagnets (Bi, Cu, Au, Ag, Si):  χ < 0, T-independent (Langevin/Landau diamagnetism).
Paramagnets (Pt, Pd, Al):  Curie law χ = C/T with C = 300 K · χ(300 K), the idealised
  localised-moment picture used in the B–H simulator. Real Pt/Pd/Al are Pauli (itinerant)
  paramagnets with nearly T-independent χ: tick the Pauli box for that.
Ferromagnets and ferrimagnets (Fe, Co, Ni, Permalloy, CoFeB / Fe3O4, YIG):
  Classical Weiss mean field: σ = M/Ms0 = L(x),  x = 3σ T_C/T + μ0 m H/(k_B T).
  Above T_C (Curie–Weiss):  χ = C/(T − T_C),  C = μ0 Ms0 m /(3 k_B)   (m = atomic moment)
  Below T_C (field ∥ M, single domain):
     χ = (3C/T) L'(x) / [1 − 3 (T_C/T) L'(x)],  x = 3σ T_C/T,  L'(x) = 1/x² − 1/sinh² x
  It diverges at T_C and tends to 0 for T → 0. In real films the initial susceptibility
  below T_C is set by domains and anisotropy (hysteresis, Hopkinson peak), not by this
  idealised result. Ferrimagnets are treated with the same single-sublattice form; the Néel
  hyperbola 1/χ = (T+θ)/C − ξ/(T−θ') is not modelled.
Antiferromagnets (NiO, IrMn):
  Above T_N:  χ = C/(T + θ)  (θ > 0 is the Weiss constant, θ values illustrative).
  Below T_N (powder average): χ = χ_N (3 − σ²)/3 with σ the staggered order parameter
  from the same mean-field equation (phenomenological). Peak (cusp) at T_N.
  Amplitude χ_N is fixed so that χ(300 K) equals the value used in the B–H simulator.
Superparamagnets (Fe3O4, Co, Ni nanoparticle films):
  Initial Langevin slope: χ = φ μ0 Ms² V /(3 k_B T) = C/T,  V = π d³/6   (Curie-like)
  Blocking temperature T_B = K V /(25 k_B). FC: C/T continues below T_B. ZFC (schematic):
  rises linearly to the peak C/T_B at T_B, then follows C/T. Non-interacting particles.
Plots: x = T or 1/T; y = χ or 1/χ. In a 1/χ vs T plot a Curie–Weiss material is a straight
line whose T-intercept is T_C (or −θ); the slope is 1/C. In χ vs 1/T a Curie material is a line
through the origin.`;
$('#th').onclick=()=>$('#dg').showModal();
addEventListener('resize',draw);matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
chips();draw();
</script></body></html>
